# Momentum semgrep rules — lane L7 (A3), built run 33 (PR #43).
# Spec source: momentum-security-audit SKILL.md, CI security-gate parity table (semgrep row).
# Rule classes = the standing bug-class sweep (F-numbers = DECISIONS.md findings ledger).
#
# CI posture: ADVISORY (JSON artifact + step summary) until the first triage lands;
# the enforce-by date is recorded on the board + run report (owner standard: no
# report-only gate forever without one).
#
# Path patterns are scan-root-anchored ('/src/**'): in CI and locally the scan root is
# the repo root, so these match the repo's own layout and no others.

rules:
  # F2 class: VITE_-prefixed env READS of secret-class names are inlined into the PUBLIC
  # bundle at build time (import.meta.env / process.env access — the actual leak mechanism;
  # a mere constant NAME holding a literal is not a bundle leak and is not matched).
  - id: momentum.no-vite-prefixed-secrets
    message: >
      VITE_ env reads end up in the public JS bundle. Never read service-role-class
      secrets (SUPABASE_SERVICE_ROLE, N8N/OneSignal REST keys) through a VITE_ name (F2).
    severity: ERROR
    languages: [generic]
    paths:
      include:
        - "/src/**"
        - "/functions/**"
        - "/netlify/functions/**"
      exclude:
        - "*test*"
        - "/node_modules/**"
        - "/dist/**"
    patterns:
      - pattern-regex: '(?:import\.meta\.env|process\.env)\.VITE_(?:SUPABASE_SERVICE_ROLE[A-Z_]*|N8N[A-Z_]*|ONESIGNAL_REST[A-Z_]*)'

  # F2 class: a service/sk_ key literal consumed in client-reachable code.
  - id: momentum.no-service-key-in-src
    message: >
      Service-class key literal under client/server code — keys reach functions
      via env bindings only; a literal here will leak into a bundle or repo (F2).
    severity: ERROR
    languages: [generic]
    paths:
      include:
        - "/src/**"
        - "/functions/**"
        - "/netlify/functions/**"
      exclude:
        - "*test*"
    patterns:
      - pattern-regex: '(sb_secret_|sk-ant-|sk_or_v1_|sk-proj-)[A-Za-z0-9_\-]{8,}'

  # F22 class: an n8n webhook fetch whose headers lack x-momentum-secret.
  # Heuristic: the fetch target metavariable must contain "n8n" (case-insensitive).
  - id: momentum.n8n-webhook-needs-secret
    message: >
      fetch() to an n8n webhook without the x-momentum-secret header (F22 class)
      — n8n rejects unauthenticated calls with 403; calls must carry the shared
      secret header.
    severity: ERROR
    languages: [generic]
    paths:
      include:
        - "/netlify/functions/**"
        - "/functions/**"
      exclude:
        - "*test*"
    patterns:
      - pattern-either:
          - pattern: |
              fetch($URL, {...})
          - pattern: |
              fetch($URL)
      # Suppress when the matched fetch statement's TEXT contains the secret header
      # anywhere in it (any header nesting) — span-level check is nesting-proof.
      - pattern-not-regex: 'x-momentum-secret'
      - metavariable-regex:
          metavariable: $URL
          regex: "(?i).*n8n.*"

  # Same class, env-member URL form (generic mode binds plain identifiers only,
  # so process.env.N8N_* targets need their own rule).
  - id: momentum.n8n-webhook-needs-secret-env
    message: >
      fetch() to an n8n webhook (env-configured URL) without the x-momentum-secret
      header (F22 class) — calls must carry the shared secret header.
    severity: ERROR
    languages: [generic]
    paths:
      include:
        - "/netlify/functions/**"
        - "/functions/**"
      exclude:
        - "*test*"
    patterns:
      # Full-statement span: fetch( through the statement's closing `);` — so the
      # suppression below sees the WHOLE call including nested header objects.
      - pattern-regex: '(?s)fetch\s*\(\s*(?:process|import\.meta)\.env\.[A-Za-z0-9_]*N8N[A-Za-z0-9_]*[\s\S]*?\);'
      - pattern-not-regex: 'x-momentum-secret'

  # F22-adjacent (Reviewer A, run 33): a HARDCODED shared-secret value in client code —
  # the header name with a string literal. Variable/expression values are fine.
  - id: momentum.no-hardcoded-n8n-secret-in-client
    message: >
      x-momentum-secret header built with a string literal under src/ (client) —
      the shared n8n secret would ship in the public bundle (F22 class). Read it
      from env/config only, or better: never send it from the client at all.
    severity: ERROR
    languages: [generic]
    paths:
      include:
        - "/src/**"
      exclude:
        - "*test*"
    patterns:
      - pattern-regex: '["'']x[_-]momentum[_-]secret["'']\s*(:|,)\s*(\[\s*)?["''][^''"][^''"]+["'']'

  # F1 class: a serverless function handler with no session-verification call in its
  # body. Every Momentum function must authenticate its caller (verifyMagicLinkSession).
  - id: momentum.function-needs-caller-auth
    message: >
      Function handler body never calls verifyMagicLinkSession — missing caller
      auth (F1 class: send-push-notification shipped as an open relay in 2026-11).
    severity: ERROR
    languages: [generic]
    paths:
      include:
        - "/netlify/functions/**"
        - "/functions/**"
      exclude:
        - "**/*_shared/**"
        - "*test*"
    patterns:
      # Full-handler span: declaration through the handler's column-0 closing brace
      # (assumes standard formatting — documented in the PR). The suppression below
      # then sees the WHOLE body, so auth anywhere in the handler suppresses the hit.
      - pattern-regex: '(?s)const\s+\w+\s*:\s*Handler\s*=\s*async[\s\S]{0,160}\{[\s\S]*?\n\}'
      # Suppression: any session-verification call inside the handler body.
      - pattern-not-regex: 'verifyMagicLinkSession'

  # F22 class: equality comparison on secret/token-named variables (timing side
  # channel); compare digests or use a constant-time primitive instead.
  - id: momentum.constant-time-secret-compare
    message: >
      === / !== comparison on a secret/token-named value — not constant-time
      (F22 class). Compare SHA-256 digests or use timingSafeEqual.
    severity: WARNING
    languages: [generic]
    paths:
      include:
        - "/netlify/functions/**"
        - "/functions/**"
      exclude:
        - "*test*"
        - "**/_shared/utils*"
    patterns:
      - pattern-either:
          - pattern: $A === $B
          - pattern: $A !== $B
      - metavariable-regex:
          metavariable: $A
          regex: "(?i).*(secret|token|apikey|api_key).*"

  # F19 class: upstream error internals leaking to clients in a JSON body.
  - id: momentum.no-error-details-leak
    message: >
      details: field carrying an error/exception value into a client JSON
      response (F19 class — strips PostgREST/pg internals).
    severity: ERROR
    languages: [generic]
    paths:
      include:
        - "/netlify/functions/**"
        - "/functions/**"
      exclude:
        - "*test*"
    patterns:
      - pattern-regex: 'details\s*:\s*(?:error|err|e|ex|exception)\b|details\s*:\s*(?:error\.)?(?:message|stack)'

[build]
  publish = "dist"
  command = "npm run build"
  functions = "netlify/functions"

[dev]
  targetPort = 8080
  port = 9999
  framework = "#custom"
  command = "npm run dev"
  autoLaunch = false
  
[functions]
  node_bundler = "esbuild"

[build.environment]
  NETLIFY_USE_EDGE_FUNCTIONS = "false"

# API routes: /api/<fn-name> -> /.netlify/functions/<fn-name>
# MUST come before the SPA fallback below, or the SPA swallows these paths
# (verified live 2026-11-08: /api/ai-generate-project returned 404 index.html).
[[redirects]]
  from = "/api/send-push-notification"
  to = "/.netlify/functions/send-push-notification"
  status = 200

[[redirects]]
  from = "/api/ai-generate-project"
  to = "/.netlify/functions/ai-generate-project"
  status = 200

[[redirects]]
  from = "/api/ai-generated-description"
  to = "/.netlify/functions/ai-generated-description"
  status = 200

[[redirects]]
  from = "/api/ai-confirm-usage"
  to = "/.netlify/functions/ai-confirm-usage"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security Headers for Production
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.onesignal.com https://api.onesignal.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https: blob:; font-src 'self' https://fonts.gstatic.com https://fonts.googleapis.com; connect-src 'self' https://*.supabase.co https://sb.145.241.109.213.sslip.io wss://sb.145.241.109.213.sslip.io https://*.onesignal.com https://n8n-pwg804wg84008c00g8www4gc.145.241.109.213.sslip.io wss://*.supabase.co wss://*.onesignal.com; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self';"

# NOTE: there is deliberately NO [[headers]] block for /api/* here. Netlify custom
# headers apply only to static files, never to function responses — the functions
# set their own CORS via getCorsHeaders() in netlify/functions/shared/utils.ts
# (origin allowlist, F12). Do not re-add a wildcard ACAO block for /api/*.


name: PR Gate

# P1-1: enforcing gate for every PR into staging.
# - Type-check (tsc -b), vitest run, production build
# - Bundle secret gate (F2): built JS must never contain the Supabase
#   service-role key, any `sb_secret_` value, or dynamic env-object access
#   (bare import.meta.env consumers make Vite inline the whole VITE_* env).
# Gates are ENFORCING: any failure fails the PR check.

on:
  pull_request:
    branches: [staging, main]
  push:
    branches: [staging]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # BASELINE DEBT (board P1-1 / D-050 ratchet): the solution build
      # (`npx tsc -b`) still fails with 97 PRE-EXISTING errors on merged
      # staging (re-measured on the run-16 lane, 2026-11-18; the app project
      # alone is 96). This step prints the count on every PR and FAILS ONLY
      # when it grows past the baseline — the number can no longer silently
      # rise. Clearing the baseline to 0 (lane L6) turns this step into a
      # plain enforcing `npx tsc -b`.
      - name: Type check (tsc -b, ratchet vs baseline 97)
        run: |
          npx tsc -b --pretty false > /tmp/tsc-output.txt || true
          COUNT=$(grep -cE 'error TS' /tmp/tsc-output.txt || true)
          BASELINE=97
          echo "tsc errors: $COUNT (baseline $BASELINE)"
          if [ "$COUNT" -gt "$BASELINE" ]; then
            echo "::error::tsc error count grew: $COUNT > baseline $BASELINE - fix the new type errors in this PR"
            head -40 /tmp/tsc-output.txt
            exit 1
          fi

      - name: Unit tests (vitest run)
        run: npm run test:run

      - name: Production build
        run: npm run build

      # D-023 leg 2 / lane L3: the 2026-11-13 incident shipped a bundle with the
      # old cloud project's anon key against the VPS database — page 200, key
      # JWT-shaped, everything else green. This gate derives URL+key FROM dist/
      # (no secrets in git) and fails on: no config, multiple addresses/keys,
      # stale-chunk mix, non-anon key role, or a cloud/VPS class mismatch
      # between the key's JWT `ref` claim and the URL's host.
      - name: Bundle config gate (key must match its database)
        # --ci: GitHub builds carry no repo .env (untracked), so zero-config is
        # the CI norm there; everything visible (multi-address/key, chunk mix,
        # key role, cloud/VPS class mismatch) is still enforced.
        run: node scripts/check-bundle-config.mjs dist --ci

      - name: Bundle secret gate (service-role key must never ship)
        run: |
          # F2: secret VALUES in shipped JS. Sourcemaps excluded: supabase-js's own
          # JSDoc mentions the env-var name; keys only matter in executed code.
          HITS=$(grep -lE 'sb_secret_|VITE_SUPABASE_SERVICE_ROLE_KEY' dist/assets/*.js 2>/dev/null || true)
          if [ -n "$HITS" ]; then
            echo "::error::Service-role key material found in the client bundle:"
            echo "$HITS"
            exit 1
          fi

          # F2 vector gate: a non-static import.meta.env access makes Vite inline
          # the entire VITE_* env object. Strip comments, then flag bare/optional
          # accesses (import.meta.env, import.meta.env?, import.meta.env[X]).
          VEC=$(grep -rn 'import.meta.env' src/ 2>/dev/null \
            | sed 's|//.*||; s|/\*.*||' \
            | grep -E 'import\.meta\.env($|\?|[^.A-Za-z])' || true)
          if [ -n "$VEC" ]; then
            echo "::error::Non-static import.meta.env access (inlines the whole env object):"
            echo "$VEC"
            exit 1
          fi

          echo "Bundle secret gate: clean"

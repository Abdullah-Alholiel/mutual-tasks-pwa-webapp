name: PR Gate

on:
  pull_request:
    branches:
      - main
      - staging

permissions:
  contents: read

concurrency:
  group: pr-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    name: tsc + vitest + build + secret-grep
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Unit tests (vitest run)
        run: npm run test:run

      - name: Production build (vite build)
        run: npm run build

      - name: Bundle secret scan (dist/)
        run: |
          # F3 (R1): prod secrets must never reach a shipped bundle.
          # Scan every dist/ artifact INCLUDING sourcemaps for Supabase secrets.
          if grep -rEn 'SERVICE_ROLE|sb_secret' dist/ --include='*' -l > /tmp/secret_hits.txt; then
            echo '::error::SECRET LEAK in dist/ — pattern SERVICE_ROLE or sb_secret found in:'
            cat /tmp/secret_hits.txt
            echo '--- matched lines ---'
            grep -rEn 'SERVICE_ROLE|sb_secret' dist/ --include='*' | head -40
            exit 1
          fi
          echo 'OK: no SERVICE_ROLE / sb_secret strings found in dist/ artifacts.'

      - name: Gate summary
        if: always()
        run: |
          echo "PR-GATE RESULT for ${{ github.event.pull_request.number }}: job done"

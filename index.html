<head>
  <meta charset="UTF-8" />

    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="mobile-web-app-capable" content="yes" />

  <meta name="description"
    content="Build momentum together. Collaborative habit and task tracking with friends for accountability and growth." />

  <link rel="apple-touch-icon" href="/icons/icon-192x192.png" />
  <!-- Fonts: Self-hosted in /fonts/satoshi/ for PWA offline support -->


  <meta property="og:title" content="Momentum - Collaborative Task & Habit Tracker" />
  <meta property="og:description"
    content="Build momentum together. Collaborative habit and task tracking with friends for accountability and growth." />
  <meta property="og:type" content="website" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:site" content="@Momentum" />
<!--
  OneSignal SDK is NOT loaded here: a hanging cdn.onesignal.com must never delay or blank
  the app (D-024). The SDK is lazy-loaded from app code after first render with a timeout
  (see src/lib/onesignal/oneSignalService.ts).
-->
  <script>
    // Opt-in on-screen diagnostics (D-029, run 11): ?diag=1 / ?diag=prof activates it and
    // it stays on for the session (sessionStorage) until ?diag=off or CLOSE. Inert for
    // normal visits. Same guard contract as the file itself; kept in sync manually.
    (function () {
      var s = sessionStorage;
      if (/[?&]diag=off/.test(location.search)) { s.removeItem('mdMode'); s.removeItem('mdStep'); s.removeItem('mdRes'); return; }
      if (/[?&]diag=(prof|1|auto)/.test(location.search)) s.setItem('mdMode', 'prof');
      if (s.getItem('mdMode') === 'prof') {
        var el = document.createElement('script');
        el.src = '/diag-panel.js';
        document.head.appendChild(el);
      }
    })();
  </script>

</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
